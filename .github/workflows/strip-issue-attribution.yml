name: Strip auto-added attribution from issues

# Removes the "Generated by Claude Code" line that tooling appends to issue
# bodies. Runs on every new/edited issue, and once over all issues when this
# file changes on main (or manually via "Run workflow").
# Edits made with GITHUB_TOKEN do not re-trigger this workflow, so no loops.

on:
  issues:
    types: [opened, edited]
  push:
    branches: [main]
    paths: [.github/workflows/strip-issue-attribution.yml]
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: strip-attribution-${{ github.event.issue.number || 'all' }}
  cancel-in-progress: false

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const re = /\n*(?:---\s*\n)?_Generated by \[Claude Code\]\(https:\/\/claude\.ai\/code\)_\s*$/;
            const clean = async (issue) => {
              const body = issue.body || '';
              if (!re.test(body)) return false;
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: body.replace(re, '').trimEnd() + '\n',
              });
              return true;
            };
            if (context.eventName === 'issues') {
              const { data } = await github.rest.issues.get({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.issue.number,
              });
              core.info(`#${data.number}: ${(await clean(data)) ? 'stripped' : 'nothing to strip'}`);
              return;
            }
            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100,
            });
            let n = 0;
            for (const issue of all) {
              if (issue.pull_request) continue;
              if (await clean(issue)) { n++; await new Promise(r => setTimeout(r, 700)); }
            }
            core.info(`stripped ${n} of ${all.length} issues`);
