{{- $root := . -}}
{{- $drainSeconds := int (default 10 .Values.shutdownDrainSeconds) -}}
{{- $graceSeconds := add $drainSeconds 20 -}}
{{- range $role, $cfg := .Values.roles }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $role }}
  labels:
    {{- include "oracledesk-backend.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  replicas: {{ default 1 $cfg.replicas }}
  strategy:
    type: {{ default "RollingUpdate" $cfg.strategy }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      labels:
        {{- include "oracledesk-backend.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
    spec:
      terminationGracePeriodSeconds: {{ $graceSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: {{ $role }}
          image: {{ include "oracledesk-backend.image" $root | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ default 8000 $root.Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PROCESS_ROLE
              value: {{ $role | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "oracledesk-backend.fullname" $root }}-config
            {{- if $root.Values.existingSecret }}
            - secretRef:
                name: {{ $root.Values.existingSecret }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          {{- if $cfg.resources }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          {{- end }}
{{- end }}
